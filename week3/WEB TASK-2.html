<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Card</title>

  <style>
    .card {
      width: 280px;
      height: 180px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px teal;
    }
  </style>
</head>

<body>

  <div class="card"></div>

</body>
</html>
