<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Cards</title>

  <style>
    :root {
      --primary: teal;
      --bg: #f5f5f5;
      --card-bg: white;
      --text: #222;
      --radius: 12px;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 30px;
      transition: transform 0.3s;
    }

    .card::before {
      content: "⭐";
      display: block;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #80cbc4;
        --bg: #121212;
        --card-bg: #1e1e1e;
        --text: #ffffff;
      }
    }
  </style>
</head>

<body>

  <div class="grid">
    <div class="card">
      <h2>Card One</h2>
      <p>First card content.</p>
    </div>

    <div class="card">
      <h2>Card Two</h2>
      <p>Second card content.</p>
    </div>

    <div class="card">
      <h2>Card Three</h2>
      <p>Third card content.</p>
    </div>
  </div>

</body>
</html>
