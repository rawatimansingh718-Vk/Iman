<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables</title>

  <style>
    :root {
      --primary: teal;
      --accent: #80cbc4;
      --bg: #f5f5f5;
      --text: #222;
      --radius: 12px;
      --spacing: 20px;
    }

    body {
      margin: 0;
      padding: var(--spacing);
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .card {
      background: var(--bg);
      color: var(--text);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: var(--spacing);
      margin-bottom: var(--spacing);
    }

    button {
      background: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
    }

    .accent {
      color: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #80cbc4;
        --accent: #4db6ac;
        --bg: #121212;
        --text: #ffffff;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>CSS Variables</h2>
    <p class="accent">This page supports dark mode.</p>
    <button>Click Me</button>
  </div>

</body>
</html>
