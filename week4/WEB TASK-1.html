<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sale Card</title>

  <style>
    .card {
      width: 280px;
      height: 180px;
      background: white;
      border: 2px solid teal;
      border-radius: 12px;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: teal;
      color: white;
      border-radius: 20px;
      padding: 5px 10px;
    }
  </style>
</head>

<body>

  <div class="card">
    <span class="badge">SALE</span>
  </div>

</body>
</html>
