
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
  body {
    font-family: system-ui;
    padding: 24px;
    max-width: 400px;
  }

  /* Skip to main content */
  .skip-link {
    position: absolute;
    left: -9999px;
  }

  .skip-link:focus {
    left: 10px;
    top: 10px;
    z-index: 9999;
    background: #1a2744;
    color: white;
    padding: 10px 16px;
    border-radius: 5px;
  }

  input {
    width: 100%;
    padding: 8px;
    border: 2px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 4px;
  }

  .error {
    color: red;
    font-size: 13px;
  }

  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }

  .icon-btn {
    background: #1a7f5a;
    color: white;
    width: 36px;
    height: 36px;
    font-size: 18px;
    border-radius: 50%;
  }

  .submit-btn {
    background: #1a56db;
    color: white;
    padding: 10px 24px;
    font-size: 15px;
    width: 100%;
    margin-top: 8px;
  }

  a img {
    display: block;
    width: 80px;
  }
</style>
</head>

<body>

<!-- Skip navigation link: First element inside body -->
<a href="#main-content" class="skip-link">
  Skip to main content
</a>

<main id="main-content">

<h2>Sign Up</h2>

<!-- Issue 1: Accessible button name -->
<button type="button" class="icon-btn" aria-label="Search">
  🔍
</button>

<!-- Issue 2: Label element -->
<label for="email-field">Email address</label>
<input type="email" id="email-field"
       placeholder="Email address">

<!-- Issue 3: Error messages -->
<div class="error">
  Error: Please enter a valid email address.
</div>

<div class="error">
  Error: Password too short.
</div>

<button type="submit" class="submit-btn">
  Create account
</button>

<!-- Issue 4: Meaningful alt text -->
<a href="/about" style="margin-top:16px; display:inline-block">
  <img src=""
       alt="About our university"
       style="background:#e0eaff;width:80px;height:40px;border-radius:4px">
</a>

</main>

</body>
</html>
